name: Update Next Run Time

on:
  workflow_run:
    workflows: ["Save Match Data"]   # 必须与 A.yml 的 name 完全一致
    types:
      - completed
  repository_dispatch:
    types: [update_next_run_time]
  workflow_dispatch:

jobs:
  run-only-if-success:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            data/next_run_datetime.json
          sparse-checkout-cone-mode: false
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests
          
      - name: Run Python with env
        run: python -m src.main
        env:
          MODE: update_next_run_time
          
      - name: Commit result file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          # 如果没有变化，避免报错
          git diff --cached --quiet || git commit -m "[render skip]Update next run time"

          git push
